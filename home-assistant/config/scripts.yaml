# Meisenknödel-Waage: re-zero (tare).
#
# The device re-zeros by adopting a *new* token published to
# `birds/scale/config/tare`, so each run must publish a fresh value (the current
# timestamp). Trigger this while the pan is empty; it takes effect on the
# device's next online cycle. Add a Lovelace button that calls this script, or
# run it from Developer Tools.
birdscale_tare:
  alias: "Meisenknödel tarieren"
  sequence:
    - service: mqtt.publish
      data:
        topic: "birds/scale/config/tare"
        retain: true
        payload: "{{ now().timestamp() | int }}"
